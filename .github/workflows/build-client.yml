name: Build Client Site
# מופעל מ-rise-builder/api/auto-build.js כשלקוחה חדשה ממלאת את הטופס

on:
  workflow_dispatch:
    inputs:
      repo_slug:
        description: 'Repo slug (kebab-case, e.g. ora-beauty)'
        required: true
        type: string
      business_type:
        description: 'eyebrows | nails | barber'
        required: true
        type: string
        default: 'eyebrows'
      client_json:
        description: 'Client info JSON (clinic_name, owner_name, phone, email, admin_password, ...)'
        required: true
        type: string
      design_json:
        description: 'Design config JSON'
        required: true
        type: string
      features_json:
        description: 'Feature flags JSON'
        required: true
        type: string
      supabase_org_id:
        description: 'Supabase organization ID for this business type'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Checkout template ──────────────────────────────────
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm deps
        run: npm ci

      # ── 2. Create Supabase project ────────────────────────────
      - name: Create Supabase project
        id: supabase
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ORG_ID: ${{ inputs.supabase_org_id }}
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          set -euo pipefail
          DB_PASS="Rise$(openssl rand -hex 8)!"
          CREATE_RESP=$(mktemp)
          CREATE_STATUS=$(curl -sS -o "$CREATE_RESP" -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects" \
            -H "Authorization: Bearer $SB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$REPO_SLUG\",\"organization_id\":\"$ORG_ID\",\"region\":\"eu-central-1\",\"plan\":\"free\",\"db_pass\":\"$DB_PASS\"}" || true)
          PROJECT_ID=""
          if [ "$CREATE_STATUS" = "200" ] || [ "$CREATE_STATUS" = "201" ] || [ "$CREATE_STATUS" = "202" ]; then
            PROJECT_ID=$(python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" < "$CREATE_RESP")
            if [ -z "$PROJECT_ID" ]; then
              echo "::error::Supabase project id missing in create response."
              cat "$CREATE_RESP"
              exit 1
            fi
            echo "Created Supabase project: $PROJECT_ID"
          else
            echo "Supabase create returned HTTP $CREATE_STATUS; trying to reuse existing project..."
            LIST_RESP=$(mktemp)
            LIST_STATUS=$(curl -sS -o "$LIST_RESP" -w "%{http_code}" "https://api.supabase.com/v1/projects" \
              -H "Authorization: Bearer $SB_TOKEN" || true)
            if [ "$LIST_STATUS" != "200" ]; then
              echo "::error::Failed to fetch Supabase projects list (HTTP $LIST_STATUS)."
              cat "$LIST_RESP"
              exit 1
            fi
            # Supabase list responses can vary in org field naming; only accept a project that matches both slug and org.
            PROJECT_ID=$(python3 -c "import json,os,sys; name=os.environ['REPO_SLUG']; org=os.environ['ORG_ID']; data=json.load(sys.stdin); items=data if isinstance(data,list) else data.get('projects',[]); exact=next((i.get('id','') for i in items if i.get('name')==name and i.get('id') and (i.get('organization_id')==org or i.get('organization')==org or i.get('org_id')==org)), ''); print(exact)" < "$LIST_RESP")
            if [ -z "$PROJECT_ID" ]; then
              echo "::error::Failed to create or find Supabase project '$REPO_SLUG'."
              cat "$CREATE_RESP"
              exit 1
            fi
            echo "Reusing Supabase project: $PROJECT_ID"
          fi
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT

          # Poll until project is ready (up to 3 min)
          STATUS=""
          for i in $(seq 1 36); do
            POLL_RESP=$(mktemp)
            POLL_STATUS=$(curl -sS -o "$POLL_RESP" -w "%{http_code}" "https://api.supabase.com/v1/projects/$PROJECT_ID" \
              -H "Authorization: Bearer $SB_TOKEN" || echo "000")
            if [ "$POLL_STATUS" = "200" ]; then
              STATUS=$(python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" < "$POLL_RESP" 2>/dev/null || echo "")
            fi
            echo "Status: $STATUS (attempt $i/36, http=$POLL_STATUS)"
            if [ "$STATUS" = "ACTIVE_HEALTHY" ]; then break; fi
            sleep 5
          done
          if [ "$STATUS" != "ACTIVE_HEALTHY" ]; then echo "::error::Supabase project not ready after 3 min (last status: $STATUS)" && exit 1; fi

          # Get API keys
          KEYS_RESP=$(mktemp)
          KEYS_HTTP=$(curl -sS -o "$KEYS_RESP" -w "%{http_code}" "https://api.supabase.com/v1/projects/$PROJECT_ID/api-keys" \
            -H "Authorization: Bearer $SB_TOKEN" || echo "000")
          if [ "$KEYS_HTTP" != "200" ]; then
            echo "::error::Failed to fetch API keys (HTTP $KEYS_HTTP)."
            cat "$KEYS_RESP"
            exit 1
          fi
          ANON_KEY=$(python3 -c "import sys,json; ks=json.load(sys.stdin); print(next(k['api_key'] for k in ks if k['name']=='anon'))" < "$KEYS_RESP")
          SERVICE_KEY=$(python3 -c "import sys,json; ks=json.load(sys.stdin); print(next(k['api_key'] for k in ks if k['name']=='service_role'))" < "$KEYS_RESP")

          SB_URL="https://$PROJECT_ID.supabase.co"
          echo "sb_url=$SB_URL" >> $GITHUB_OUTPUT
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT
          echo "service_key=$SERVICE_KEY" >> $GITHUB_OUTPUT
          echo "Supabase ready: $SB_URL"

      # ── 3. Run schema.sql ────────────────────────────────────
      - name: Run schema SQL
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ steps.supabase.outputs.project_id }}
        run: |
          SCHEMA=$(cat docs/schema.sql | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          SCHEMA_RESP=$(mktemp)
          SCHEMA_HTTP=$(curl -sS -o "$SCHEMA_RESP" -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $SCHEMA}" || echo "000")
          if [ "$SCHEMA_HTTP" != "200" ] && [ "$SCHEMA_HTTP" != "201" ]; then
            echo "::warning::Schema SQL returned HTTP $SCHEMA_HTTP"
            cat "$SCHEMA_RESP"
          fi
          echo "Schema applied"

      # ── 4. RLS + Storage + push_subscriptions ────────────────
      - name: Run RLS and Storage SQL
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ steps.supabase.outputs.project_id }}
        run: |
          SQL="
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON TABLE appointments, clients, gallery, orders, products,
                    reviews, services, settings, staff, waitlist
            TO anon, authenticated;

          -- ── RLS — enable on all main tables + explicit anon policies ──
          -- The admin panel writes via the anon key (src/utils/db.js) and the app has no
          -- Supabase Auth, so anon needs full CRUD. These policies turn RLS ON with explicit
          -- allow-rules (removes the RLS-disabled default-open state). service_role (used by
          -- /api/*.js) bypasses RLS. Row-scoping would require server-side admin writes + auth.
          ALTER TABLE public.appointments ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.clients      ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.gallery      ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.orders       ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.products     ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.reviews      ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.services     ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.settings     ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.staff        ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.waitlist     ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS anon_all_appointments ON public.appointments;
          CREATE POLICY anon_all_appointments ON public.appointments FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);
          DROP POLICY IF EXISTS anon_all_clients ON public.clients;
          CREATE POLICY anon_all_clients ON public.clients FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);
          DROP POLICY IF EXISTS anon_all_gallery ON public.gallery;
          CREATE POLICY anon_all_gallery ON public.gallery FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);
          DROP POLICY IF EXISTS anon_all_orders ON public.orders;
          CREATE POLICY anon_all_orders ON public.orders FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);
          DROP POLICY IF EXISTS anon_all_products ON public.products;
          CREATE POLICY anon_all_products ON public.products FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);
          DROP POLICY IF EXISTS anon_all_reviews ON public.reviews;
          CREATE POLICY anon_all_reviews ON public.reviews FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);
          DROP POLICY IF EXISTS anon_all_services ON public.services;
          CREATE POLICY anon_all_services ON public.services FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);
          DROP POLICY IF EXISTS anon_all_settings ON public.settings;
          CREATE POLICY anon_all_settings ON public.settings FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);
          DROP POLICY IF EXISTS anon_all_staff ON public.staff;
          CREATE POLICY anon_all_staff ON public.staff FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);
          DROP POLICY IF EXISTS anon_all_waitlist ON public.waitlist;
          CREATE POLICY anon_all_waitlist ON public.waitlist FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);

          INSERT INTO storage.buckets (id, name, public)
          VALUES ('media', 'media', true)
          ON CONFLICT (id) DO NOTHING;

          DROP POLICY IF EXISTS anon_all_media ON storage.objects;
          CREATE POLICY anon_all_media ON storage.objects
            FOR ALL TO anon, authenticated
            USING (bucket_id = 'media')
            WITH CHECK (bucket_id = 'media');

          CREATE TABLE IF NOT EXISTS public.push_subscriptions (
            id uuid primary key default gen_random_uuid(),
            user_type text not null,
            user_identifier text not null,
            subscription jsonb not null,
            device_info text,
            active boolean not null default true,
            created_at timestamptz not null default now()
          );
          CREATE INDEX IF NOT EXISTS push_subscriptions_lookup_idx
            ON public.push_subscriptions (user_type, user_identifier, active);
          CREATE UNIQUE INDEX IF NOT EXISTS push_subscriptions_endpoint_uidx
            ON public.push_subscriptions ((subscription->>'endpoint'));
          ALTER TABLE public.push_subscriptions ENABLE ROW LEVEL SECURITY;
          GRANT INSERT, DELETE ON TABLE public.push_subscriptions TO anon;
          GRANT ALL ON TABLE public.push_subscriptions TO service_role;
          DROP POLICY IF EXISTS anon_insert_subscription ON public.push_subscriptions;
          CREATE POLICY anon_insert_subscription ON public.push_subscriptions FOR INSERT TO anon WITH CHECK (true);
          DROP POLICY IF EXISTS anon_delete_own_endpoint ON public.push_subscriptions;
          CREATE POLICY anon_delete_own_endpoint ON public.push_subscriptions FOR DELETE TO anon USING (true);
          "
          ENCODED=$(echo "$SQL" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          RLS_RESP=$(mktemp)
          RLS_HTTP=$(curl -sS -o "$RLS_RESP" -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $ENCODED}" || echo "000")
          if [ "$RLS_HTTP" != "200" ] && [ "$RLS_HTTP" != "201" ]; then
            echo "::warning::RLS SQL returned HTTP $RLS_HTTP"
            cat "$RLS_RESP"
          fi
          echo "RLS + Storage + push_subscriptions applied"

      # ── 5. Generate VAPID keys ────────────────────────────────
      - name: Generate VAPID keys
        id: vapid
        run: |
          node << 'EOF'
          const { webcrypto } = require('crypto');
          (async () => {
            const kp = await webcrypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
            const pub = Buffer.from(await webcrypto.subtle.exportKey('raw', kp.publicKey));
            const priv = Buffer.from(await webcrypto.subtle.exportKey('pkcs8', kp.privateKey));
            const b64u = b => b.toString('base64').replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
            // P-256 pkcs8: 36 bytes header + 32 bytes private key
            const privRaw = priv.slice(36, 68);
            console.log('VAPID_PUBLIC=' + b64u(pub));
            console.log('VAPID_PRIVATE=' + b64u(privRaw));
          })();
          EOF
          node << 'EOF' >> $GITHUB_OUTPUT
          const { webcrypto } = require('crypto');
          (async () => {
            const kp = await webcrypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
            const pub = Buffer.from(await webcrypto.subtle.exportKey('raw', kp.publicKey));
            const priv = Buffer.from(await webcrypto.subtle.exportKey('pkcs8', kp.privateKey));
            const b64u = b => b.toString('base64').replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
            const privRaw = priv.slice(36, 68);
            process.stdout.write('public=' + b64u(pub) + '\n');
            process.stdout.write('private=' + b64u(privRaw) + '\n');
          })();
          EOF

      # ── 6. Update client-specific files ──────────────────────
      - name: Generate client files
        env:
          DESIGN_JSON: ${{ inputs.design_json }}
          FEATURES_JSON: ${{ inputs.features_json }}
          CLIENT_JSON: ${{ inputs.client_json }}
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const design = JSON.parse(process.env.DESIGN_JSON);
          const features = JSON.parse(process.env.FEATURES_JSON);
          const client = JSON.parse(process.env.CLIENT_JSON);
          const slug = process.env.REPO_SLUG;

          // design.js
          fs.writeFileSync('src/config/design.js',
            `/* Auto-generated for ${client.clinic_name} */\nexport const design = ${JSON.stringify(design, null, 2)};\n`
          );

          // features.js
          fs.writeFileSync('src/config/features.js',
            `export const features = ${JSON.stringify({...features, smsReminders: false}, null, 2)};\n`
          );

          // vercel.json
          const vj = JSON.parse(fs.readFileSync('vercel.json','utf8'));
          vj.alias = [slug + '.vercel.app'];
          fs.writeFileSync('vercel.json', JSON.stringify(vj, null, 2) + '\n');

          // manifest.json
          try {
            const mpath = 'public/manifest.json';
            if (fs.existsSync(mpath)) {
              const m = JSON.parse(fs.readFileSync(mpath,'utf8'));
              m.name = client.clinic_name;
              m.short_name = (client.clinic_name||'').slice(0,12);
              m.theme_color = design.colors.primary;
              m.background_color = design.colors.bg;
              fs.writeFileSync(mpath, JSON.stringify(m, null, 2) + '\n');
            }
          } catch(e) { console.log('manifest skip:', e.message); }

          console.log('Client files written OK');
          EOF

      # ── 7. Create .env ────────────────────────────────────────
      - name: Write .env
        env:
          CLIENT_JSON: ${{ inputs.client_json }}
          SB_URL: ${{ steps.supabase.outputs.sb_url }}
          SB_ANON: ${{ steps.supabase.outputs.anon_key }}
          SB_SVC: ${{ steps.supabase.outputs.service_key }}
          VAPID_PUB: ${{ steps.vapid.outputs.public }}
          VAPID_PRIV: ${{ steps.vapid.outputs.private }}
        run: |
          CLIENT=$(echo "$CLIENT_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('owner_phone',''))")
          cat > .env << ENVEOF
          VITE_SUPABASE_URL=${SB_URL}
          VITE_SUPABASE_KEY=${SB_ANON}
          VITE_VAPID_PUBLIC_KEY=${VAPID_PUB}
          TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE=${{ secrets.TWILIO_PHONE }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          OWNER_PHONE=$CLIENT
          VAPID_PUBLIC_KEY=${VAPID_PUB}
          VAPID_PRIVATE_KEY=${VAPID_PRIV}
          SUPABASE_SERVICE_KEY=${SB_SVC}
          ENVEOF
          echo ".env written"

      # ── 8. Build npm ──────────────────────────────────────────
      - name: npm run build
        run: npm run build

      # ── 9. Create GitHub repo + push ─────────────────────────
      - name: Create GitHub repo and push
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          GH_TOKEN=$(printf '%s' "$GH_TOKEN" | tr -d '\357\273\277')
          export GH_TOKEN
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT secret is not set. Skipping GitHub repo creation."
            echo "::warning::To fix: go to Repository Settings → Secrets and variables → Actions → New repository secret, name it GH_PAT, and paste a classic PAT with 'repo' scope."
            exit 0
          fi
          # Validate the token before doing any work (gh auth status uses GH_TOKEN env var securely)
          if ! gh auth status --hostname github.com > /dev/null 2>&1; then
            echo "::warning::GH_PAT is invalid or expired (gh auth status failed)."
            echo "::warning::To fix: go to Repository Settings → Secrets and variables → Actions → update the GH_PAT secret with a valid classic PAT that has 'repo' scope."
            echo "::warning::Skipping GitHub repo creation — Vercel deploy will still proceed."
            exit 0
          fi
          git config user.email "boltagent8@gmail.com"
          git config user.name "RISE Auto-Builder"
          git remote remove origin || true
          git add -A
          git commit -m "init: $REPO_SLUG" || true
          gh repo create galohana/$REPO_SLUG --private --source=. --remote=origin --push
          echo "Pushed to galohana/$REPO_SLUG"

      # ── 10. Deploy to Vercel ──────────────────────────────────
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Vercel initial deploy
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          set +e
          VTOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '\357\273\277')
          # Deploy from a directory named after the slug so Vercel creates/links a
          # DEDICATED project per client. The default checkout dir is named after the
          # template repo, which would make every clone deploy INTO the template's own
          # Vercel project and clobber its env + production deployment.
          DEPLOY_DIR="$RUNNER_TEMP/$REPO_SLUG"
          rm -rf "$DEPLOY_DIR"; mkdir -p "$DEPLOY_DIR"
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='.vercel' --exclude='dist' ./ "$DEPLOY_DIR"/
          echo "$DEPLOY_DIR" > "$RUNNER_TEMP/deploy_dir"
          cd "$DEPLOY_DIR"
          OUTPUT=$(vercel --prod --token="$VTOKEN" --yes 2>&1)
          VEXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $VEXIT -ne 0 ]; then
            echo "::error::Vercel initial deploy failed (exit $VEXIT). See CLI output above."
            exit $VEXIT
          fi
          DEPLOY_URL=$(echo "$OUTPUT" | grep -oP 'https://[a-zA-Z0-9-]+\.vercel\.app' | head -1)
          # SAFETY GUARD: a clone must NEVER land on a template project.
          if echo "$DEPLOY_URL" | grep -qiE 'eyebrowsweb|nailsweb|barberweb'; then
            echo "::error::Deploy URL '$DEPLOY_URL' points at a TEMPLATE project, not '$REPO_SLUG'. Aborting to protect the template."
            exit 1
          fi
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed: $DEPLOY_URL"

      # ── 11. Add env vars to Vercel ────────────────────────────
      - name: Add Vercel env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLIENT_JSON: ${{ inputs.client_json }}
          SB_URL: ${{ steps.supabase.outputs.sb_url }}
          SB_ANON: ${{ steps.supabase.outputs.anon_key }}
          SB_SVC: ${{ steps.supabase.outputs.service_key }}
          VAPID_PUB: ${{ steps.vapid.outputs.public }}
          VAPID_PRIV: ${{ steps.vapid.outputs.private }}
          RAW_TW_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          RAW_TW_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          RAW_TW_PHONE: ${{ secrets.TWILIO_PHONE }}
          RAW_RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Operate inside the per-client deploy dir so env vars target the CLIENT's
          # Vercel project (linked in the deploy step), never the template's.
          cd "$(cat "$RUNNER_TEMP/deploy_dir")"
          # Strip BOM (U+FEFF) + CR from every secret value before it reaches Vercel.
          clean() { printf '%s' "$1" | tr -d '\357\273\277\r'; }
          VTOKEN=$(clean "$VERCEL_TOKEN")
          CLIENT_PHONE=$(echo "$CLIENT_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('owner_phone',''))")

          add_env() {
            # Remove an existing value first so re-runs overwrite (not error), then add the clean value.
            vercel env rm "$1" production --token="$VTOKEN" --yes >/dev/null 2>&1 || true
            if printf '%s' "$2" | vercel env add "$1" production --token="$VTOKEN" --yes 2>&1 | tail -1; then
              echo "  set $1"
            else
              echo "::warning::failed to set Vercel env $1"
            fi
          }

          add_env VITE_SUPABASE_URL "$SB_URL"
          add_env VITE_SUPABASE_KEY "$SB_ANON"
          add_env SUPABASE_SERVICE_KEY "$SB_SVC"
          add_env VITE_VAPID_PUBLIC_KEY "$VAPID_PUB"
          add_env VAPID_PUBLIC_KEY "$VAPID_PUB"
          add_env VAPID_PRIVATE_KEY "$VAPID_PRIV"
          add_env VAPID_SUBJECT "mailto:boltagent8@gmail.com"
          add_env OWNER_PHONE "$CLIENT_PHONE"
          add_env TWILIO_ACCOUNT_SID "$(clean "$RAW_TW_SID")"
          add_env TWILIO_AUTH_TOKEN "$(clean "$RAW_TW_TOKEN")"
          add_env TWILIO_PHONE "$(clean "$RAW_TW_PHONE")"
          add_env RESEND_API_KEY "$(clean "$RAW_RESEND")"
          echo "Env vars added"

      - name: Vercel redeploy with env vars
        id: vercel_final
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          cd "$(cat "$RUNNER_TEMP/deploy_dir")"
          set +e
          VTOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '\357\273\277')
          OUTPUT=$(vercel --prod --token="$VTOKEN" --yes 2>&1)
          VEXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $VEXIT -ne 0 ]; then
            echo "::error::Vercel redeploy failed (exit $VEXIT). See CLI output above."
            exit $VEXIT
          fi
          DEPLOY_URL=$(echo "$OUTPUT" | grep -oP 'https://[a-zA-Z0-9-]+\.vercel\.app' | head -1)
          if echo "$DEPLOY_URL" | grep -qiE 'eyebrowsweb|nailsweb|barberweb'; then
            echo "::error::Redeploy URL '$DEPLOY_URL' points at a TEMPLATE project. Aborting."
            exit 1
          fi
          vercel alias set "$DEPLOY_URL" "${REPO_SLUG}.vercel.app" --token="$VTOKEN" 2>&1 || true
          echo "final_url=https://${REPO_SLUG}.vercel.app" >> $GITHUB_OUTPUT

      # ── 12. Insert Supabase client data ───────────────────────
      - name: Insert Supabase data
        env:
          CLIENT_JSON: ${{ inputs.client_json }}
          BUSINESS_TYPE: ${{ inputs.business_type }}
          SB_URL: ${{ steps.supabase.outputs.sb_url }}
          SB_SVC: ${{ steps.supabase.outputs.service_key }}
        run: |
          node << 'EOF'
          const client = JSON.parse(process.env.CLIENT_JSON);
          const url = process.env.SB_URL;
          const key = process.env.SB_SVC;
          // Gender/venue-appropriate cancellation terms per business type (barber = masculine).
          const terms = (process.env.BUSINESS_TYPE || 'eyebrows') === 'barber'
            ? 'ברוך הבא! בקביעת תור אתה מאשר את תנאי הביטול — ביטול פחות מ-24 שעות לפני התור יחויב בדמי ביטול.'
            : 'ברוכות הבאות! בקביעת תור את מאשרת את תנאי הביטול — ביטול פחות מ-24 שעות לפני התור יחויב בדמי ביטול.';

          const headers = {
            'apikey': key, 'Authorization': `Bearer ${key}`,
            'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates',
          };

          const phone = client.phone || '';
          const inserts = [
            { key: 'clinicInfo', value: {
              name: client.clinic_name, ownerName: client.owner_name,
              ownerFullName: client.owner_full_name || client.owner_name,
              phone, whatsapp: phone, ownerWhatsapp: phone,
              address: client.address || '', instagram: client.instagram || '',
              bitAccount: phone, ownerEmail: client.email,
            }},
            { key: 'bitAccount', value: phone },
            { key: 'adminPassword', value: client.admin_password },
            { key: 'ownerEmail', value: client.email },
            { key: 'terms', value: terms },
          ];

          Promise.all(inserts.map(({ key, value }) =>
            fetch(`${url}/rest/v1/settings`, {
              method: 'POST', headers,
              body: JSON.stringify({ key, value }),
            }).then(r => r.text()).then(t => console.log(key, ':', t.slice(0,60)))
          )).then(() => process.exit(0)).catch(e => { console.error(e.message); process.exit(1); });
          EOF

      # ── 13. Send completion notification ─────────────────────
      - name: Notify Gal
        env:
          CLIENT_JSON: ${{ inputs.client_json }}
          REPO_SLUG: ${{ inputs.repo_slug }}
          FINAL_URL: ${{ steps.vercel_final.outputs.final_url }}
          RAW_RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          export RESEND_CLEAN=$(printf '%s' "$RAW_RESEND" | tr -d '\357\273\277\r')
          node << 'EOF'
          const client = JSON.parse(process.env.CLIENT_JSON);
          const slug = process.env.REPO_SLUG;
          const url = process.env.FINAL_URL || `https://${slug}.vercel.app`;
          const adminUrl = `${url}/manage-x7k2`;

          const send = (payload) => fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${process.env.RESEND_CLEAN}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          }).then(r => r.json()).then(j => console.log('email:', JSON.stringify(j))).catch(e => console.error('email error:', e));

          // Internal notice only — client email sent manually via send-client-email.yml after Gal's approval
          send({
            from: 'RISE Auto-Builder <noreply@rise-booking.com>',
            to: ['boltagent8@gmail.com'],
            subject: `✅ האתר מוכן — ${client.clinic_name}`,
            text: [
              `האתר של ${client.clinic_name} עלה בהצלחה! 🎉`,
              '',
              `🌐 אתר: ${url}`,
              `🔧 Admin: ${adminUrl}`,
              `🔑 סיסמה: ${client.admin_password}`,
              `📦 GitHub: https://github.com/galohana/${slug}`,
              '',
              `לקוחה: ${client.owner_name} | ${client.phone} | ${client.email}`,
              '',
              `⚡ לשליחת מייל ללקוחה — הפעל ידנית: send-client-email.yml עם repo_slug=${slug}`,
            ].join('\n'),
          }).then(() => process.exit(0)).catch(() => process.exit(0));
          EOF
          echo "Internal notification sent — client email pending manual approval via send-client-email.yml"

      # ── 13b. Register cron jobs on cron-job.org ───────────────
      # Reminders + pending-approval sweeps. Never fails the build (continue-on-error);
      # if CRON_API_KEY is missing it only warns with manual instructions.
      - name: Register cron jobs
        continue-on-error: true
        env:
          REPO_SLUG: ${{ inputs.repo_slug }}
          RAW_CRON_KEY: ${{ secrets.CRON_API_KEY }}
        run: |
          CRON_KEY=$(printf '%s' "$RAW_CRON_KEY" | tr -d '\357\273\277\r')
          SITE="https://${REPO_SLUG}.vercel.app"
          if [ -z "$CRON_KEY" ]; then
            echo "::warning::CRON_API_KEY secret missing — skipping automatic cron registration."
            echo "::warning::Set up manually at cron-job.org: $SITE/api/cron-reminders (every 15 min) + $SITE/api/cron-pending (daily 08:00 Asia/Jerusalem)."
            exit 0
          fi
          create_cron() {
            # $1=title  $2=url  $3=schedule-json
            RESP=$(curl -sS -w $'\n%{http_code}' -X PUT "https://api.cron-job.org/jobs" \
              -H "Authorization: Bearer $CRON_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"job\":{\"url\":\"$2\",\"enabled\":true,\"title\":\"$1\",\"saveResponses\":false,\"requestMethod\":0,\"schedule\":$3}}" 2>&1)
            CODE=$(printf '%s' "$RESP" | tail -1)
            BODY=$(printf '%s' "$RESP" | sed '$d')
            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
              echo "  ✓ cron registered: $1"
            else
              echo "::warning::cron-job.org HTTP $CODE for '$1' — $BODY"
            fi
          }
          # cron-reminders — every 15 minutes
          create_cron "RISE reminders — ${REPO_SLUG}" "$SITE/api/cron-reminders" '{"timezone":"Asia/Jerusalem","hours":[-1],"mdays":[-1],"minutes":[0,15,30,45],"months":[-1],"wdays":[-1]}'
          # cron-pending — daily at 08:00
          create_cron "RISE pending — ${REPO_SLUG}" "$SITE/api/cron-pending" '{"timezone":"Asia/Jerusalem","hours":[8],"mdays":[-1],"minutes":[0],"months":[-1],"wdays":[-1]}'
          echo "Cron registration done"

      # ── 14. Notify Gal on FAILURE ─────────────────────────────
      - name: Notify Gal on failure
        if: failure()
        env:
          CLIENT_JSON: ${{ inputs.client_json }}
          REPO_SLUG: ${{ inputs.repo_slug }}
          BUSINESS_TYPE: ${{ inputs.business_type }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOBS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs
          GH_TOKEN_RO: ${{ github.token }}
          RAW_RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          export RESEND_CLEAN=$(printf '%s' "$RAW_RESEND" | tr -d '\357\273\277\r')
          # Best-effort: which step failed. The auto github.token (not the GH_PAT secret) is always valid; jq is preinstalled.
          export FAILED_STEP=$(curl -sS -H "Authorization: Bearer $GH_TOKEN_RO" -H "Accept: application/vnd.github+json" "$JOBS_URL" 2>/dev/null | jq -r 'first(.jobs[].steps[] | select(.conclusion=="failure") | .name) // "לא ידוע"' 2>/dev/null || echo "לא ידוע")
          [ -z "$FAILED_STEP" ] && export FAILED_STEP="לא ידוע"
          node << 'EOF'
          const client = JSON.parse(process.env.CLIENT_JSON || '{}');
          const slug = process.env.REPO_SLUG || '';
          const biz = process.env.BUSINESS_TYPE || '';
          const failedStep = process.env.FAILED_STEP || 'לא ידוע';
          const runUrl = process.env.RUN_URL || '';
          fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${process.env.RESEND_CLEAN}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              from: 'RISE Auto-Builder <noreply@rise-booking.com>',
              to: ['gal@rise-booking.com'],
              subject: `❌ הבנייה נכשלה — ${client.clinic_name || slug}`,
              text: [
                `הבנייה האוטומטית של אתר RISE נכשלה.`,
                '',
                `🏷️ לקוחה: ${client.clinic_name || '—'}`,
                `🔖 slug: ${slug}`,
                `💼 סוג עסק: ${biz || '—'}`,
                `🛑 שלב שנכשל: ${failedStep}`,
                '',
                `🔗 צפייה בריצה המלאה: ${runUrl}`,
                client.email ? `📧 אימייל לקוחה: ${client.email}` : '',
              ].filter(Boolean).join('\n'),
            }),
          }).then(r => r.json()).then(j => console.log('failure-notify:', JSON.stringify(j))).catch(console.error);
          EOF
          echo "Failure notification attempted"
